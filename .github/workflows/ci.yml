name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aula
          POSTGRES_PASSWORD: aula
          POSTGRES_DB: aula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aula -d aula"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Alembic upgrade (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://aula:aula@localhost:5432/aula
          SECRET_KEY: ci-not-a-real-secret-key-32-chars-min
        run: alembic upgrade head
      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg://aula:aula@localhost:5432/aula
          SECRET_KEY: ci-not-a-real-secret-key-32-chars-min
        run: pytest --cov=app --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
